name: Build Self-Host Image

on:
  push:
    branches:
      - razor
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build native modules
        run: yarn affine @affine/native build

      - name: Build web
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: canary

      - name: Build admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: canary

      - name: Build mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: canary

      - name: Build server native (amd64)
        uses: ./.github/actions/build-rust
        with:
          target: x86_64-unknown-linux-gnu
          package: '@affine/server-native'

      - name: Rename amd64 native
        run: |
          mv packages/backend/native/server-native.node packages/backend/native/server-native.x64.node

      - name: Build server native (arm64)
        uses: ./.github/actions/build-rust
        with:
          target: aarch64-unknown-linux-gnu
          package: '@affine/server-native'

      - name: Rename arm64 native
        run: |
          mv packages/backend/native/server-native.node packages/backend/native/server-native.arm64.node

      - name: Build server native (armv7)
        uses: ./.github/actions/build-rust
        with:
          target: armv7-unknown-linux-gnueabihf
          package: '@affine/server-native'

      - name: Rename armv7 native
        run: |
          mv packages/backend/native/server-native.node packages/backend/native/server-native.armv7.node

      - name: List native files
        run: ls -la packages/backend/native/*.node

      - name: Build server
        run: yarn workspace @affine/server build

      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64", "arm64", "arm"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules to server
        run: mv ./node_modules ./packages/backend/server

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: .github/deployment/node/Dockerfile
          tags: |
            ghcr.io/razorbackdb/affine:latest
            ghcr.io/razorbackdb/affine:${{ steps.meta.outputs.short_sha }}
            ghcr.io/razorbackdb/affine:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short_sha }}
          platforms: linux/amd64,linux/arm64
